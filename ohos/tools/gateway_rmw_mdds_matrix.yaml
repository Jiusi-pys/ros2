# Unified MDDS<->DDS gateway config for the rmw_mdds<->rmw_fastrtps cross-board
# pub/sub-class lane matrix. Each mapping bridges one MDDS (DSoftBus) topic with
# one DDS (rmw_fastrtps) topic. These mddsTopicName values are domain-neutral
# templates. run_cross_board_rmw_mdds_matrix.sh adds rmw_mdds' d<domain>/
# namespace before verified deployment to the gateway board. ddsTopicName is
# the stock rmw_fastrtps node ROS topic.
mappings:
  - mddsTopicName: rt/mx_chatter
    ddsTopicName: /mx_chatter
    rosTypeName: std_msgs/msg/String
    direction: BIDIRECTIONAL
    qos:
      reliability: RELIABLE
      durability: VOLATILE
      history: KEEP_LAST
      depth: 10

  - mddsTopicName: rt/mx_pose
    ddsTopicName: /mx_pose
    rosTypeName: geometry_msgs/msg/PoseStamped
    direction: BIDIRECTIONAL
    qos:
      reliability: RELIABLE
      durability: VOLATILE
      history: KEEP_LAST
      depth: 10

  - mddsTopicName: rt/mx_be
    ddsTopicName: /mx_be
    rosTypeName: std_msgs/msg/String
    direction: BIDIRECTIONAL
    qos:
      reliability: BEST_EFFORT
      durability: VOLATILE
      history: KEEP_LAST
      depth: 10

  - mddsTopicName: rt/mx_tf
    ddsTopicName: /mx_tf
    rosTypeName: tf2_msgs/msg/TFMessage
    direction: BIDIRECTIONAL
    qos:
      reliability: RELIABLE
      durability: VOLATILE
      history: KEEP_LAST
      depth: 10
