# mdds_gateway configuration for the L3 gateway e2e tests (run_mdds_gw.sh).
# /chatter:      GW-01/02/03/05/06 demo talker/listener bridge
# /chatter_back: GW-03 board->PC direction (kept separate from /chatter so the
#                two directions cannot cross-talk on the PC side)
# /mdds_sweep:   GW-04 large-message sweep (board_sweep.py)
cyclone_domain_id = 0
mdds_domain_id = 0
# mdds_announce_period_ms MUST stay at the fleet default (500): peers expire a
# participant after 4x their OWN announce period (boards: 500ms -> 2000ms), so
# a slower beacon here (e.g. 2000ms) sits exactly at the boards' eviction
# boundary and makes discovery of the gateway flap.
mdds_announce_period_ms = 500
mdds_udp_base_port = 47811
mdds_udp_port_count = 32
# presence beacon period: must stay <= 200ms (fleet sweep timeout, see config.hpp)
mdds_udp_announce_ms = 50
mdds_use_dsoftbus = false
# Pin cross-device mdds traffic to the board-to-board Ethernet segment. Both
# boards are multi-homed (WiFi 192.168.8.0/24 + Ethernet 192.168.77.0/24);
# without this the gateway accepted announces from either subnet and half the
# GW-04 bulk traffic hairpinned onto the congested WiFi (route flapped at the
# 50ms announce cadence before mdds gained route stickiness).
mdds_udp_peer_allow = 192.168.77.0/24
dedup_ttl_ms = 5000
dedup_capacity = 4096
topic = /chatter
topic = /chatter_back
topic = /mdds_sweep
# /mdds_lat_req + /mdds_lat_rsp: board_latency.py ping-pong RTT through the gateway
topic = /mdds_lat_req
topic = /mdds_lat_rsp
