# DSoftBus-only mdds_gateway configuration for the L3 gateway e2e tests
# (run_mdds_gw.sh). Board B's rmw_mdds test process sources the same
# DSoftBus-only profile and ROS domain; the CycloneDDS/PC side remains domain
# 0. There is intentionally no UDP transport or IP allowlist here.
# This is a template, not a static fleet configuration.  run_mdds_gw.sh
# materializes the four @GW_TOPIC_*@ placeholders from its validated RUN_ID
# and nonce, hashes that rendered file, and deploys the resulting config.  A
# unique topic namespace prevents a stale external ROS/MDDS participant from
# satisfying a current gate by publishing to a reused /chatter name.
# @GW_TOPIC_CHATTER@:      GW-01/02/03/05/06/07/08 bridge
# @GW_TOPIC_CHATTER_BACK@: GW-03 board->PC direction (separate from chatter)
# @GW_TOPIC_SWEEP@:        GW-04 large-message sweep (board_sweep.py)
# @GW_TOPIC_LAT_REQ@ / @GW_TOPIC_LAT_RSP@: reserved latency ping-pong pair
cyclone_domain_id = 0
mdds_domain_id = 44
# mdds_announce_period_ms MUST stay at the fleet default (500): peers expire a
# participant after 4x their OWN announce period (boards: 500ms -> 2000ms), so
# a slower beacon here (e.g. 2000ms) sits exactly at the boards' eviction
# boundary and makes discovery of the gateway flap.
mdds_announce_period_ms = 500
# Strict DSoftBus Socket/Bytes data plane: mdds_gateway fails closed if the
# backend cannot Socket/Listen/BindAsync; it must not silently fall back to
# UDP. run_mdds_gw.sh additionally checks the gateway's active-backend log.
mdds_transport = dsoftbus
# Ring dedup stays OFF for this single-gateway topology: content fingerprints
# would merge legitimate identical samples published inside the TTL window.
# Set to "content" only when a second gateway can close a forwarding ring.
dedup_mode = off
dedup_ttl_ms = 5000
dedup_capacity = 4096
topic = @GW_TOPIC_CHATTER@
topic = @GW_TOPIC_CHATTER_BACK@
topic = @GW_TOPIC_SWEEP@
topic = @GW_TOPIC_LAT_REQ@
topic = @GW_TOPIC_LAT_RSP@
