# mdds_gateway configuration for the DSoftBus-only gate (run_mdds_dsb.sh).
# DS-03: board B (rmw_mdds, MDDS_TRANSPORT=dsoftbus) -> this gateway on
# board A -> Windows PC (rmw_cyclonedds_cpp).
#
# The Cyclone leg deliberately uses a test-only domain, rather than production
# domain 0: independently owned PC ROS processes can remain in domain 0 while
# this gate proves the gateway path without discovering or routing through them.
# The PC sweep launcher pins the same value. A production-domain-0 smoke remains
# a separate release gate and is not implied by DS-03.
cyclone_domain_id = 46
# mdds side runs on domain 43 (session com.kaihong.mdds.d43): board A's
# pre-existing round-3 `ros2 topic echo` (PID 22646) squat on domain 0's
# session and is not ours to kill; domain 42's tuple is DDoS-latched from
# this gate's first runs. The Cyclone side is independently isolated on 46.
mdds_domain_id = 43
# mdds_announce_period_ms MUST stay at the fleet default (500): peers expire a
# participant after 4x their OWN announce period (boards: 500ms -> 2000ms), so
# a slower beacon here (e.g. 2000ms) sits exactly at the boards' eviction
# boundary and makes discovery of the gateway flap.
mdds_announce_period_ms = 500
# Formal transport selector: dsoftbus ONLY. The gateway forces
# use_udp_loopback=false / udp_cross_device=false and runs fail-closed: if the
# DSoftBus backend cannot start (Socket/Listen/registry), startup aborts with a
# non-zero exit and the requested/active/failed backend report. There is no
# silent UDP fallback, and no mdds_udp_port_count=0 hack.
mdds_transport = dsoftbus
# Ring dedup stays OFF for this single-gateway topology: content fingerprints
# would merge legitimate identical samples published inside the TTL window.
dedup_mode = off
dedup_ttl_ms = 5000
dedup_capacity = 4096
# DS-03 has exactly one target topic.  `run_mdds_dsb.sh` renders this
# placeholder to a RUN_ID + nonce-scoped name before it transfers the file to
# board A.  A fixed shared topic would let a stale or unrelated domain-43
# publisher satisfy a current-run PC result, so the template itself must never
# be deployed as an executable test configuration.
topic = @DS3_TOPIC@
